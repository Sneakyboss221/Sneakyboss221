<svg xmlns="http://www.w3.org/2000/svg" width="400" height="206" viewBox="0 0 400 206" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Most used languages</title>
<desc id="desc">Python 56.5%, TeX 12.5%, nesC 10.9%, Jupyter Notebook 8.0%, TypeScript 7.5%, MATLAB 2.3%, Other 2.4%</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .label { font-size: 14px; }
  .value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; }
  .col { font-size: 11px; fill: #818b98; letter-spacing: 0.04em; }
  .secondary { fill: #59636e; }
  .muted { fill: #818b98; }
  .icon { fill: #59636e; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="399" height="205" rx="6" fill="none" stroke="none"/>
<text x="20" y="28" class="col">MOST USED LANGUAGES</text>
<mask id="bar"><rect class="grow" x="20" y="48" width="360" height="10" rx="5" fill="#fff"/></mask>
<g mask="url(#bar)"><rect x="20.00" y="48" width="196.50" height="10" fill="#3572A5"/><rect x="218.50" y="48" width="43.47" height="10" fill="#3D6117"/><rect x="263.97" y="48" width="37.88" height="10" fill="#94B0C7"/><rect x="303.85" y="48" width="27.95" height="10" fill="#DA5B0B"/><rect x="333.80" y="48" width="26.02" height="10" fill="#3178c6"/><rect x="361.82" y="48" width="7.91" height="10" fill="#e16737"/><rect x="371.73" y="48" width="8.27" height="10" fill="#8c959f"/></g>
<g transform="translate(20 84)"><g class="fade" style="animation-delay: 200ms"><circle cx="5" cy="6" r="5" fill="#3572A5"/><text x="16" y="11" class="label">Python <tspan class="secondary">56.5%</tspan></text></g></g>
<g transform="translate(200 84)"><g class="fade" style="animation-delay: 270ms"><circle cx="5" cy="6" r="5" fill="#3D6117"/><text x="16" y="11" class="label">TeX <tspan class="secondary">12.5%</tspan></text></g></g>
<g transform="translate(20 116)"><g class="fade" style="animation-delay: 340ms"><circle cx="5" cy="6" r="5" fill="#94B0C7"/><text x="16" y="11" class="label">nesC <tspan class="secondary">10.9%</tspan></text></g></g>
<g transform="translate(200 116)"><g class="fade" style="animation-delay: 410ms"><circle cx="5" cy="6" r="5" fill="#DA5B0B"/><text x="16" y="11" class="label">Jupyter Noteb… <tspan class="secondary">8.0%</tspan></text></g></g>
<g transform="translate(20 148)"><g class="fade" style="animation-delay: 480ms"><circle cx="5" cy="6" r="5" fill="#3178c6"/><text x="16" y="11" class="label">TypeScript <tspan class="secondary">7.5%</tspan></text></g></g>
<g transform="translate(200 148)"><g class="fade" style="animation-delay: 550ms"><circle cx="5" cy="6" r="5" fill="#e16737"/><text x="16" y="11" class="label">MATLAB <tspan class="secondary">2.3%</tspan></text></g></g>
<g transform="translate(20 180)"><g class="fade" style="animation-delay: 620ms"><circle cx="5" cy="6" r="5" fill="#8c959f"/><text x="16" y="11" class="label">Other <tspan class="secondary">2.4%</tspan></text></g></g>
</svg>
